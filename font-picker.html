<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Font Picker — Niraj Nagtilak</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; padding: 2rem; }
    h1 { font-size: 1rem; color: #888; margin-bottom: 2rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 1.5rem; }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.5rem 2rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .card:hover { border-color: #C8A96E; background: #1f1f1f; }
    .card.selected { border-color: #C8A96E; background: #241f14; }
    .name {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }
    .name span { color: #C8A96E; }
    .meta { font-size: 0.75rem; color: #555; letter-spacing: 0.05em; }
    .selected-banner {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: #C8A96E; color: #111; font-weight: 700;
      padding: 0.75rem 2rem; border-radius: 999px;
      font-size: 0.9rem; letter-spacing: 0.05em;
      opacity: 0; transition: opacity 0.2s;
      pointer-events: none;
    }
    .selected-banner.show { opacity: 1; }
    #filter {
      width: 100%; max-width: 400px; padding: 0.6rem 1rem;
      background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
      color: #fff; font-size: 0.9rem; margin-bottom: 2rem;
      outline: none;
    }
    #filter:focus { border-color: #C8A96E; }
  </style>
</head>
<body>

<h1>Font Picker — click a card to select, scroll to browse all 100</h1>
<input id="filter" type="text" placeholder="Filter by font name…" oninput="filterFonts(this.value)" />
<div class="grid" id="grid"></div>
<div class="selected-banner" id="banner"></div>

<script>
const FONTS = [
  "Abril Fatface","Alegreya","Alegreya Sans","Anton","Archivo","Archivo Black",
  "Arvo","Assistant","Barlow","Barlow Condensed","Barlow Semi Condensed",
  "Be Vietnam Pro","Bebas Neue","Big Shoulders Display","Bitter","Black Han Sans",
  "Bodoni Moda","Bricolage Grotesque","Cabin","Cairo","Cantata One","Caveat",
  "Cinzel","Cormorant","Cormorant Garamond","Crimson Pro","DM Sans","DM Serif Display",
  "Darker Grotesque","Domine","EB Garamond","Exo 2","Familjen Grotesk",
  "Figtree","Fraunces","Geologica","Gloock","Hanken Grotesk","Heebo",
  "IBM Plex Sans","IBM Plex Serif","Instrument Sans","Instrument Serif",
  "Inter Tight","Josefin Sans","Josefin Slab","Jost","Kantumruy Pro",
  "Karla","Lato","League Spartan","Libre Baskerville","Libre Franklin",
  "Lora","Manrope","Marcellus","Merriweather","Merriweather Sans",
  "Montserrat","Mulish","Noto Sans","Noto Serif","Nunito","Nunito Sans",
  "Open Sans","Oswald","Outfit","Overpass","Oxanium","PT Sans",
  "PT Serif","Pacifico","Philosopher","Playfair Display","Plus Jakarta Sans",
  "Poppins","Quicksand","Raleway","Red Hat Display","Roboto","Roboto Condensed",
  "Roboto Flex","Roboto Serif","Rubik","Saira","Saira Condensed",
  "Schibsted Grotesk","Sora","Source Sans 3","Source Serif 4",
  "Spectral","Tenor Sans","Titillium Web","Ubuntu","Unbounded",
  "Urbanist","Vollkorn","Work Sans","Yanone Kaffeesatz","Zilla Slab"
];

const toParam = f => f.replace(/ /g, '+');

function loadFont(family) {
  const id = 'gf-' + family.replace(/ /g,'');
  if (!document.getElementById(id)) {
    const link = document.createElement('link');
    link.id = id;
    link.rel = 'stylesheet';
    link.href = `https://fonts.googleapis.com/css2?family=${toParam(family)}:wght@400;700&display=swap`;
    document.head.appendChild(link);
  }
}

function buildCard(family) {
  loadFont(family);
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.font = family.toLowerCase();
  card.innerHTML = `
    <div class="name" style="font-family:'${family}',sans-serif">Niraj <span>Nagtilak</span></div>
    <div class="meta">${family}</div>
  `;
  card.addEventListener('click', () => {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    const banner = document.getElementById('banner');
    banner.textContent = `Selected: ${family}`;
    banner.classList.add('show');
    clearTimeout(banner._t);
    banner._t = setTimeout(() => banner.classList.remove('show'), 3000);
  });
  return card;
}

const grid = document.getElementById('grid');
FONTS.forEach(f => grid.appendChild(buildCard(f)));

function filterFonts(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.card').forEach(card => {
    card.style.display = card.dataset.font.includes(q) ? '' : 'none';
  });
}
</script>
</body>
</html>
